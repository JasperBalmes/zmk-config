# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other.
---
include:
  # Dancing dogs + status screen (shield dogs_oled lives in boards/shields/dogs_oled).
  # The older skull animation is still in boards/shields/skull_oled: to go back to it,
  # change `dogs_oled` to `skull_oled` on the two lines below.
  - board: eyelash_nano
    shield: eyelash_corne_right dogs_oled
  - board: eyelash_nano
    shield: eyelash_corne_left dogs_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: eyelash_nano
    shield: settings_reset

  # Fallback: the Eyelash vendor's own OLED screens (zmk-nice-oled), no custom animation.
  # Flash these if the skull build misbehaves, to tell a screen problem from an animation problem.
  - board: eyelash_nano
    shield: eyelash_corne_right nice_oled
    artifact-name: eyelash_corne_right_nice_oled_fallback
  - board: eyelash_nano
    shield: eyelash_corne_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_left_nice_oled_fallback
