# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # nice_view_gem replaces the stock nice_view shield (same display, animated screen).
  # No nice_view_adapter needed: the Eyelash shield already defines nice_view_spi.
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view_gem
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset
  # Fallback builds with the stock nice!view screen (no animation), to test whether
  # a black screen comes from the gem module or from something else.
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
    artifact-name: eyelash_corne_right_stock_screen
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_left_stock_screen
